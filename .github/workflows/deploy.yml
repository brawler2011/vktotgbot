name: CI/CD Deploy via SSH

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax checks
        run: |
          python -m py_compile config.py database.py vk_client.py tg_bot.py main.py

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_DISCUSSION_ID: ${{ secrets.TELEGRAM_DISCUSSION_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_DOMAIN: ${{ vars.VK_GROUP_DOMAIN || secrets.VK_GROUP_DOMAIN || 'irs2027' }}
          POLL_INTERVAL: ${{ vars.POLL_INTERVAL || secrets.POLL_INTERVAL || '10' }}
          INITIAL_POSTS_COUNT: ${{ vars.INITIAL_POSTS_COUNT || secrets.INITIAL_POSTS_COUNT || '5' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || '' }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHANNEL_ID,TELEGRAM_DISCUSSION_ID,TELEGRAM_TOPIC_ID,VK_ACCESS_TOKEN,VK_GROUP_DOMAIN,POLL_INTERVAL,INITIAL_POSTS_COUNT
          script_stop: false
          script: |
            set -e

            eval TARGET_DIR="${{ secrets.SERVER_PATH || '~/vktotg' }}"
            echo "🚀 Развёртывание в директорию: $TARGET_DIR"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Проверяем наличие репозитория на сервере, если нет - клонируем автоматически
            if [ ! -f "docker-compose.yml" ] && [ ! -d ".git" ]; then
              echo "📥 Репозиторий ещё не склонирован. Автоматическое клонирование..."
              git clone https://github.com/${{ github.repository }}.git .
            elif [ -d ".git" ]; then
              echo "📥 Обновление репозитория через Git..."
              git fetch origin
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
              git reset --hard "origin/$CURRENT_BRANCH" || git reset --hard origin/main || git reset --hard origin/master
            fi

            # 2. Инъекция переменных окружения в .env
            echo "🔐 Запись конфигурации .env из GitHub Actions Secrets..."
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
            echo "TELEGRAM_CHANNEL_ID=$TELEGRAM_CHANNEL_ID" >> .env
            echo "TELEGRAM_DISCUSSION_ID=$TELEGRAM_DISCUSSION_ID" >> .env
            echo "TELEGRAM_TOPIC_ID=$TELEGRAM_TOPIC_ID" >> .env
            echo "VK_ACCESS_TOKEN=$VK_ACCESS_TOKEN" >> .env
            echo "VK_GROUP_DOMAIN=$VK_GROUP_DOMAIN" >> .env
            echo "POLL_INTERVAL=$POLL_INTERVAL" >> .env
            echo "INITIAL_POSTS_COUNT=$INITIAL_POSTS_COUNT" >> .env
            echo "DATABASE_PATH=data/bot.db" >> .env
            chmod 600 .env
            echo "✅ Файл .env успешно записан"

            # 3. Диагностика Docker и Docker Compose
            echo "🔍 Определение Docker Compose и проверка прав..."
            COMPOSE_CMD=""

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif sudo -n docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="sudo docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            elif sudo -n command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="sudo docker-compose"
            fi

            if [ -z "$COMPOSE_CMD" ]; then
              echo "❌ Ошибка: Docker или Docker Compose не найден, либо у пользователя нет прав!"
              echo "Пользователь: $(whoami)"
              echo "Docker binary: $(which docker || echo 'не найден')"
              echo ""
              echo "👉 Если Docker установлен, выдайте пользователю права без sudo:"
              echo "   sudo usermod -aG docker $(whoami)"
              echo "   newgrp docker"
              echo ""
              echo "👉 Если Docker не установлен на сервере, установите его:"
              echo "   curl -fsSL https://get.docker.com | sh"
              exit 1
            fi

            echo "🐳 Используется команда: $COMPOSE_CMD"

            # 4. Запуск контейнеров
            echo "🐳 Перезапуск контейнеров..."
            $COMPOSE_CMD down --remove-orphans || true
            $COMPOSE_CMD up -d --build

            # Очистка старых образов
            docker image prune -f 2>/dev/null || sudo -n docker image prune -f 2>/dev/null || true

            echo "✅ Деплой успешно завершён!"
