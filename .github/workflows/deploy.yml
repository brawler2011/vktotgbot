name: CI/CD Deploy via SSH

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax checks
        run: |
          python -m py_compile config.py database.py vk_client.py tg_bot.py main.py

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_DISCUSSION_ID: ${{ secrets.TELEGRAM_DISCUSSION_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_DOMAIN: ${{ vars.VK_GROUP_DOMAIN || secrets.VK_GROUP_DOMAIN || 'irs2027' }}
          POLL_INTERVAL: ${{ vars.POLL_INTERVAL || secrets.POLL_INTERVAL || '60' }}
          INITIAL_POSTS_COUNT: ${{ vars.INITIAL_POSTS_COUNT || secrets.INITIAL_POSTS_COUNT || '5' }}
          ENV_CONTENT: ${{ secrets.ENV_FILE || '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || '' }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHANNEL_ID,TELEGRAM_DISCUSSION_ID,VK_ACCESS_TOKEN,VK_GROUP_DOMAIN,POLL_INTERVAL,INITIAL_POSTS_COUNT,ENV_CONTENT
          script_stop: true
          script: |
            set -e

            TARGET_DIR="${{ secrets.SERVER_PATH || '~/vktotg' }}"
            echo "🚀 Начало деплоя в директорию: $TARGET_DIR"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Обновление репозитория
            if [ -d .git ]; then
              echo "📥 Загрузка последних изменений из Git..."
              git fetch origin
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
              git reset --hard "origin/$CURRENT_BRANCH" || git reset --hard origin/main || git reset --hard origin/master
            fi

            # Генерация .env из GitHub Actions Secrets
            echo "🔐 Инъекция переменных окружения из GitHub Actions Secrets..."
            if [ -n "$ENV_CONTENT" ]; then
              echo "$ENV_CONTENT" > .env
            else
              cat <<EOF > .env
TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
TELEGRAM_CHANNEL_ID=$TELEGRAM_CHANNEL_ID
TELEGRAM_DISCUSSION_ID=$TELEGRAM_DISCUSSION_ID
VK_ACCESS_TOKEN=$VK_ACCESS_TOKEN
VK_GROUP_DOMAIN=$VK_GROUP_DOMAIN
POLL_INTERVAL=$POLL_INTERVAL
INITIAL_POSTS_COUNT=$INITIAL_POSTS_COUNT
DATABASE_PATH=data/bot.db
EOF
            fi
            chmod 600 .env

            # Пересборка и запуск контейнеров через Docker Compose
            echo "🐳 Пересборка и перезапуск Docker Compose..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # Очистка неиспользуемых старых образов
            docker image prune -f

            echo "✅ Деплой успешно завершён!"
